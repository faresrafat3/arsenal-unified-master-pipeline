name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Lint and parse check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: pip install --upgrade pip && pip install ruff
      - name: Ruff (syntax + undefined names)
        # The README explicitly states this is an 'architecture reference,
        # not yet an installable runtime'. The CI gate confirms the code
        # at least parses and has no undefined names; running the
        # pipeline requires the full runtime deps + an LLM provider.
        run: ruff check arsenal_ai/ --select=E9,F63,F7,F82
      - name: Python compile check
        run: |
          python3 -m compileall -q arsenal_ai/
